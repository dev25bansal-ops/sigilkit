name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FOUNDRY_VERSION: "v1.7.1"
  FOUNDRY_PROFILE: ci

jobs:
  # Required evidence is produced in this tag run, never borrowed from branch CI.
  # RPC forks, wallet E2E, Echidna and the nightly toolchain canary are not release gates.
  assurance:
    name: Required assurance for publishing commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ github.sha }}", submodules: recursive, fetch-depth: 0 }
      - name: Validate release identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== 'tag' || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '')) {
            throw new Error('Release requires a v-prefixed package version tag');
          }
          for (const p of ['core', 'indexer', 'mcp']) {
            const manifest = JSON.parse(readFileSync(`packages/${p}/package.json`, 'utf8'));
            if (manifest.private || `v${manifest.version}` !== tag) {
              throw new Error(`Tag/version mismatch for ${p}: ${tag} versus ${manifest.version}`);
            }
          }
          NODE
      - name: Bind checkout to triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci

      - name: Full local gate (build before dependent typechecks)
        run: npm run verify
      - name: Required deep fuzz and invariants
        env:
          FOUNDRY_PROFILE: deep
        run: forge test --no-match-contract '.*Fork'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install required security tools
        run: pip install slither-analyzer==0.11.6 halmos==0.3.3
      - name: Required Slither analysis
        run: slither contracts/src --fail-high
      - name: Required Halmos verification
        env:
          HALMOS_ALLOW_DOWNLOAD: "1"
        run: halmos --match-contract Halmos
      - name: Install and run required secret scan
        run: |
          set -euo pipefail
          # The installer prints the absolute path of the verified binary (it installs into
          # $RUNNER_TEMP, not the repo root, so the ~40MB blob never enters the worktree).
          gitleaks_bin="$(bash scripts/install-gitleaks.sh)"
          "$gitleaks_bin" detect --config .gitleaks.toml --redact --no-banner
      - name: Required workspace coverage thresholds
        run: npm run test:coverage --workspaces
      - name: Required ABI drift check
        run: |
          while IFS= read -r c; do
            c="${c%%#*}"; c="$(echo "$c" | tr -d '[:space:]')"
            [ -z "$c" ] && continue
            forge inspect "contracts/src/$c.sol:$c" abi --json > "packages/core/abis/$c.json"
          done < scripts/abi-targets.txt
          git diff --exit-code packages/core/abis

      # TD-4/TD-10: the whitepaper's prose counts are what an auditor or grant reviewer
      # reads, and they cannot be derived without running the suites — so verify them here,
      # at the point of release, rather than trusting them.
      - name: Verify whitepaper counts (including TypeScript totals)
        run: node scripts/check-doc-counts.mjs --with-ts

      # ARCH-1: preview EVERY publishable package, not just core. A package that cannot pack
      # cleanly (missing dist, stray files, no files[] allowlist) must fail here, not after
      # it is on the registry.
      - name: Pack preview (all publishable packages)
        run: |
          for p in core indexer mcp; do
            echo "::group::pack preview @sigilkit/$p"
            npm pack --dry-run --workspace "@sigilkit/$p"
            echo "::endgroup::"
          done

      - name: Record successfully tested commit
        id: identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish assured commit
    needs: assurance
    if: ${{ needs.assurance.result == 'success' && needs.assurance.outputs.sha == github.sha }}
    runs-on: ubuntu-latest
    environment: npm
    # Overrides the top-level block to add OIDC (`npm publish --provenance` attests the
    # build to the registry and needs an OIDC token). Scoped to this job only — the
    # assurance job above runs the full gate and needs nothing beyond contents: read.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ github.sha }}", submodules: recursive }
      - name: Verify checkout matches assurance
        env:
          ASSURED_SHA: ${{ needs.assurance.outputs.sha }}
        run: |
          test "$ASSURED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$ASSURED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build --workspaces --if-present

      # Preflight: a package name can already exist on the registry without belonging to us.
      # `@sigilkit/core` is exactly that case — it is published by a different project, so
      # `npm publish` fails with an opaque E403 only after the whole gate has run. Fail here,
      # with the reason, instead.
      - name: Check npm scope ownership
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          me="$(npm whoami)"
          echo "authenticated as: $me"
          status=0
          for p in core indexer mcp; do
            pkg="@sigilkit/$p"
            if ! npm view "$pkg" version >/dev/null 2>&1; then
              echo "ok       $pkg does not exist yet — will be created"
              continue
            fi
            owners="$(npm view "$pkg" maintainers --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(m=>m.name).join(' '))}catch{console.log('')}})")"
            if [ -z "$owners" ]; then
              echo "warn     $pkg exists but its maintainers could not be read"
              continue
            fi
            case " $owners " in
              *" $me "*)
                echo "ok       $pkg exists and $me maintains it ($owners)" ;;
              *)
                echo "::error title=Scope conflict::$pkg already exists on npm and is maintained by: $owners"
                echo "::error::Publishing as '$me' will fail with E403. Rename the package scope, or publish under a scope you control."
                status=1 ;;
            esac
          done
          exit $status

      # Publish in dependency order (core -> indexer -> mcp): core is the leaf
      # dependency, indexer builds on it, mcp on both. Skipping any version already
      # on the registry makes re-running a tag safe.
      - name: Publish (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in core indexer mcp; do
            ver="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "@sigilkit/$p@$ver" version >/dev/null 2>&1; then
              echo "@sigilkit/$p@$ver already published — skipping"
              continue
            fi
            echo "::group::publishing @sigilkit/$p@$ver"
            npm publish --provenance --access public --workspace "@sigilkit/$p"
            echo "::endgroup::"
          done

      - name: Record published versions
        run: |
          {
            echo "### Published from ${GITHUB_REF}"
            echo
            for p in core indexer mcp; do
              echo "- \`@sigilkit/$p@$(node -p "require('./packages/$p/package.json').version")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
