name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# `--provenance` needs an OIDC token; contents:read is the minimum for checkout.
permissions:
  contents: read
  id-token: write

env:
  FOUNDRY_VERSION: "v1.7.1"

jobs:
  publish:
    name: Publish packages (tag-gated)
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci

      # ---- full gate: nothing ships unless the whole repo is green for THIS tag ----
      - name: Validate workflows and documented counts
        run: |
          node scripts/validate-workflows.mjs
          node scripts/check-doc-counts.mjs
      - run: forge test --no-match-contract '.*Invariant|.*Fork'
      - run: forge test --match-contract '.*Invariant'
      - run: npm run lint --workspaces
      - run: npm run build --workspaces
      - run: npm test --workspaces --if-present

      # TD-4/TD-10: the whitepaper's prose counts are what an auditor or grant reviewer
      # reads, and they cannot be derived without running the suites — so verify them here,
      # at the point of release, rather than trusting them.
      - name: Verify whitepaper counts (including TypeScript totals)
        run: node scripts/check-doc-counts.mjs --with-ts

      # ARCH-1: preview EVERY publishable package, not just core. A package that cannot pack
      # cleanly (missing dist, stray files, no files[] allowlist) must fail here, not after
      # it is on the registry.
      - name: Pack preview (all publishable packages)
        run: |
          for p in core indexer mcp; do
            echo "::group::pack preview @sigilkit/$p"
            npm pack --dry-run --workspace "@sigilkit/$p"
            echo "::endgroup::"
          done

      # Preflight: a package name can already exist on the registry without belonging to us.
      # `@sigilkit/core` is exactly that case — it is published by a different project, so
      # `npm publish` fails with an opaque E403 only after the whole gate has run. Fail here,
      # with the reason, instead.
      - name: Check npm scope ownership
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          me="$(npm whoami)"
          echo "authenticated as: $me"
          status=0
          for p in core indexer mcp; do
            pkg="@sigilkit/$p"
            if ! npm view "$pkg" version >/dev/null 2>&1; then
              echo "ok       $pkg does not exist yet — will be created"
              continue
            fi
            owners="$(npm view "$pkg" maintainers --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(m=>m.name).join(' '))}catch{console.log('')}})")"
            if [ -z "$owners" ]; then
              echo "warn     $pkg exists but its maintainers could not be read"
              continue
            fi
            case " $owners " in
              *" $me "*)
                echo "ok       $pkg exists and $me maintains it ($owners)" ;;
              *)
                echo "::error title=Scope conflict::$pkg already exists on npm and is maintained by: $owners"
                echo "::error::Publishing as '$me' will fail with E403. Rename the package scope, or publish under a scope you control."
                status=1 ;;
            esac
          done
          exit $status

      # Publish in dependency order (core -> indexer -> mcp): core is the leaf
      # dependency, indexer builds on it, mcp on both. Skipping any version already
      # on the registry makes re-running a tag safe.
      - name: Publish (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in core indexer mcp; do
            ver="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "@sigilkit/$p@$ver" version >/dev/null 2>&1; then
              echo "@sigilkit/$p@$ver already published — skipping"
              continue
            fi
            echo "::group::publishing @sigilkit/$p@$ver"
            npm publish --provenance --access public --workspace "@sigilkit/$p"
            echo "::endgroup::"
          done

      - name: Record published versions
        run: |
          {
            echo "### Published from ${GITHUB_REF}"
            echo
            for p in core indexer mcp; do
              echo "- \`@sigilkit/$p@$(node -p "require('./packages/$p/package.json').version")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
