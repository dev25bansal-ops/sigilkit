name: SigilKit CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC — gates forge-deep-fuzz and forge-fork-base.
    - cron: "17 3 * * *"
    # Weekly Mondays 04:23 UTC — wallet conformance harnesses.
    - cron: "23 4 * * 1"
    # Monthly on the 1st 04:43 UTC — Foundry nightly canary.
    - cron: "43 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repo. Without an explicit block the
# job inherits the repository/org default token permissions, which may include write on
# contents, packages, pull-requests and more — so a compromised step (see SEC-07) would
# have far more reach than the workflow needs. Pin it read-only at the top level.
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci
  # Pinned Foundry: nightly moved `--invariant-runs` into config-only and can break
  # the gate at any time (found 2026-09). The foundry-canary job below tests nightly
  # separately so bumps are caught deliberately. Bump in one place (this env var).
  FOUNDRY_VERSION: "v1.7.1"

jobs:
  # 0. Workflow lint — catches the class of defect that silently disabled every job
  #    below (a mis-indented step made ci.yml unparseable; GitHub rejects the whole
  #    file, not just the offending step). Runs first so it fails fastest.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Validate workflow YAML
        run: node scripts/validate-workflows.mjs
      # CI-02: docs/CI-WAIVERS.md is a real register (dated criteria, hard expiries, rule
      # #3 "red runs don't reset silently") but nothing enforced it: adding a
      # `continue-on-error` without a row was invisible, and an expired row never turned any
      # job red. This is the machine half of that register, so the waiver governance cannot
      # silently rot. Failing here fails the PR.
      - name: Test CI waiver guard
        run: node --test scripts/check-waivers.test.mjs
      - name: Check CI waivers are registered and unexpired
        run: node scripts/check-waivers.mjs
      # P1-WIRE: docs/CI-WAIVERS.md carries TWO registers. The step above checks the first
      # (job-level `continue-on-error`, which must be registered and unexpired). This step
      # checks the second — the "Item (not a CI job)" table, whose rows are a promise that a
      # specific Foundry test is red ON PURPOSE. `check-waivers.mjs` deliberately skips that
      # table, correctly: a failing Solidity test is not a `continue-on-error` job, so a row
      # there would read as a stale row and redden this job for no reason. The consequence was
      # that the second table had no enforcement at all, and its SEC-10 row outlived its own
      # removal criterion — the test was rewritten under Option B and went green while the row
      # kept claiming an "intentionally failing assertion".
      #
      # THIS STEP IS EXPECTED TO BE RED. That is the gate working: the SEC-10 row is stale and
      # this is what says so. Do NOT relax the check, add a continue-on-error, or drop the
      # step to get a green run — the red is the finding, and the fix is to resolve the row
      # (delete it, or re-point the test under Option A), not to silence the report. Tracked
      # for disposition by the P1 handoff; see docs/CI-WAIVERS.md for the row itself.
      #
      # Exit 2 (forge unavailable) is a failure here, not a skip: an unverifiable waiver is not
      # a satisfied one, and the job has foundry-toolchain installed two steps earlier.
      - name: Check intentional test-failure waivers are still red
        run: node scripts/check-test-waivers.mjs
      # The image is the one deliverable CI cannot build cheaply, so check its static
      # invariants (COPY sources exist, .dockerignore does not exclude them, ENTRYPOINT
      # resolves) here rather than discovering a broken image at release time.
      - name: Test container packaging guard
        run: node --test scripts/check-dockerfile.test.mjs
      - name: Check container packaging
        run: node scripts/check-dockerfile.mjs
      - name: Test documentation count guard and verification CLI
        run: node --test scripts/check-doc-counts.test.mjs scripts/verify.test.mjs
      - name: Check documented counts against the toolchain
        run: node scripts/check-doc-counts.mjs
      # SK-15/V66-1: the package-artifact guard and the remaining helper suites were
      # previously dead in CI — a regression could land without any gate noticing.
      - name: Test package artifact guard and helper suites
        run: node --test scripts/check-package-artifacts.test.mjs scripts/check-runtime.test.mjs scripts/assurance-inventory.test.mjs scripts/benchmark-indexer.test.mjs
      # P0-WIRE: these three guards each had a full test suite but were executed by NOTHING —
      # not by this job, not by `npm run verify`. Their suites were referenced in verify.mjs's
      # `helpers` --test list and that was the whole of their existence, so a regression in any
      # of them landed while the suites stayed green. They are real steps now.
      - name: Check every test suite on disk is actually run
        run: node scripts/check-helper-suites.mjs
      - name: Test the suite-registry guard
        run: node --test scripts/check-helper-suites.test.mjs
      - name: Check workflow-invoked script paths are committed
        run: node scripts/check-tracked-refs.mjs
      - name: Test the tracked-refs guard
        run: node --test scripts/check-tracked-refs.test.mjs
      # The reparse-point probe asks whether THIS host can create and traverse a symbolic
      # link/junction. It is a portability signal, not a dependency gate: on the Linux runner
      # it is structurally always green, and its own header says not to read it as one. It is
      # wired in so the suite is genuinely executed somewhere, and so a Windows contributor
      # gets the same answer CI would give. Exit 2 = no verdict, and is not a pass.
      - name: Probe host reparse-point capability
        run: node scripts/check-reparse-points.mjs
      - name: Test the reparse-point probe
        run: node --test scripts/check-reparse-points.test.mjs
      # SEC-07: this used to pipe an unpinned script from actionlint's *default branch*
      # into bash (`bash <(curl -sSf .../main/scripts/download-actionlint.bash)`), so anyone
      # who could push to rhysd/actionlint:main got RCE in every CI run of this repo, with
      # its token and secrets. The installer pins the version AND verifies the tarball
      # SHA256 before extracting, and writes the binary to $RUNNER_TEMP instead of the repo
      # root. `bin` is captured from stdout so the path is resolved once and reused.
      #
      # DIGEST VERIFICATION (closed 2026-10-03; re-verify on any version bump):
      #  - actionlint: ACTIONLINT_SHA256 in scripts/install-actionlint.sh equals the
      #    linux_amd64 entry of the release's own actionlint_1.7.9_checksums.txt
      #    (233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4).
      #  - gitleaks: GITLEAKS_SHA256 in scripts/install-gitleaks.sh equals the GitHub API
      #    asset digest for gitleaks_8.30.1_linux_x64.tar.gz
      #    (551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb).
      #  Both came from upstream-published records, not from the built tarball; a
      #  substitution between publication and download is the remaining, separately
      #  mitigated risk. Do NOT resolve a future mismatch by deleting or relaxing the
      #  digest check — that is the exact vulnerability this step replaced.
      - id: actionlint-install
        name: Install actionlint (pinned + checksum-verified)
        run: echo "bin=$(bash scripts/install-actionlint.sh)" >> "$GITHUB_OUTPUT"
      - name: Run actionlint
        run: >-
          "${{ steps.actionlint-install.outputs.bin }}" -color

  # 1. Forge unit + fuzz (PR gate) — 2k fuzz runs/test via [profile.ci.fuzz]
  forge-unit:
    name: Forge unit + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - run: forge build --sizes
      # Fork smoke runs nightly against a real Base fork; its assertions are
      # fork-specific by design and would fail on a local chain.
      - run: forge test --no-match-contract '.*Invariant|.*Fork'

  # 2. Forge invariant (PR gate) — 256 runs via [profile.ci.invariant]
  #    (forge >=1.x has no --invariant-runs CLI flag; depth is config-only)
  forge-invariant:
    name: Forge invariant (INV-1..4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - run: forge test --match-contract '.*Invariant'

  # 3. Slither static analysis (PR gate, fail on high)
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # 6.x does not exist on PyPI (latest line is 0.11.x); pin the current release.
      - run: pip install slither-analyzer==0.11.6
      - run: slither --version
      - run: slither contracts/src --fail-high

  # 3b. Secret scanning (SEC-4/TD-7) — the repo intentionally contains Anvil's public dev
  #     keys, so scanning must be tuned (.gitleaks.toml) rather than absent. Runs on the
  #     full history so a secret cannot hide in an earlier commit.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: gitleaks-install
        name: Install gitleaks (pinned + checksum-verified)
        run: echo "bin=$(bash scripts/install-gitleaks.sh)" >> "$GITHUB_OUTPUT"
      - name: Scan full history
        run: >-
          "${{ steps.gitleaks-install.outputs.bin }}" detect --config .gitleaks.toml --redact --no-banner --verbose

  # 4. TS SDK — typecheck, lint, build both workspaces, conformance against Anvil (PR gate)
  ts-sdk:
    name: TS SDK conformance (Anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm }
      - run: npm ci
      # Dependency-advisory gate. Nothing in the repo ran `npm audit` before this, and
      # `.github/dependabot.yml` cannot cover it either: the GitHub API reports Dependabot
      # alerts DISABLED for this repository (HTTP 403 — a private repo needs GHAS), so the
      # "default security-updates lane" its comment relied on does not exist. A security fix
      # can therefore only arrive as an ordinary grouped Dependabot PR, which is a review
      # queue rather than an alarm. `--audit-level=high` is the bar: it fails the build on a
      # high-or-critical advisory and stays quiet on the low/moderate noise that would
      # otherwise train people to ignore a red X.
      - name: Dependency audit (npm audit, high+)
        run: npm audit --audit-level=high
      # CQ-3: lint and test EVERY workspace, not just core. The indexer and mcp suites
      # (and mcp's typecheck) were previously never run in CI — which is exactly where the
      # audit-trail data-integrity bugs lived. `publish.yml` already used --workspaces,
      # so the two workflows disagreed on the gate; they now agree.
      # Build BEFORE lint: demo-agent/indexer/mcp typecheck against @sigilkit/core's
      # dist/*.d.ts (its exports point at dist), which only exists after a build. On a
      # fresh clone, lint-before-build cannot resolve the module at all (CI-found).
      # Dependency-ordered, not alphabetical: @sigilkit/agent sorts before core but
      # imports it, so `--workspaces` compiled agent first and every import failed TS2307.
      - run: npm run build
      # T-05 vector no-op gate. `actionrequest.json` and `merkle-v2.json` are generated
      # from @sigilkit/core's OWN dist, so a breaking SDK change followed by a generator
      # re-run produces a clean `git diff` — the self-certifying loop absorbs the break
      # silently. Regenerating here and failing on any diff turns "absorbed" into "must
      # be reviewed": a diff here is a request to change the committed vectors, not a
      # no-op. `-- vectors/` limits the check to the corpus; --ignore-cr-at-eol is
      # deliberately NOT used, because a line-ending-only change is still a change the
      # reviewer should see.
      #
      # The generator needs no forge, but it does need packages/core/dist, which the build
      # above produced — hence the placement. The diff check is enforced whenever
      # generation succeeds; a generation failure degrades to a visible warning rather
      # than a hard fail, because a broken generator is a different defect from a vector
      # change and must not be able to red every unrelated PR. The warning is an
      # annotation, not a silent pass: `check-vectors.mjs` below still enforces counts,
      # 32-byte shapes and `_provenance` on the committed corpus.
      - name: Vector regeneration must be a no-op (T-05)
        run: |
          if npm run vectors:generate; then
            git diff --exit-code -- vectors/
          else
            echo "::warning::vector regeneration skipped (generator unavailable) — the no-op gate did not run; review vectors/ by hand"
          fi
      - name: Check vector corpus counts and provenance
        run: node scripts/check-vectors.mjs
      - name: Test vector corpus guard
        run: node --test scripts/check-vectors.test.mjs
      # Static entry-point guard, after build so dist/ exists on a fresh checkout
      # (mirrors verify.mjs ordering). Working-tree check only — not an install test.
      - name: Check workspace package artifacts
        run: node scripts/check-package-artifacts.mjs
      # Cross-document fact-source guard (node engine floor, forge test scope, foundry
      # version). It is NOT a step inside `npm run verify` — a run-time error here (for
      # example the digit-slice floor in bootstrap.mjs that turned ">=100" into "10")
      # would otherwise stay invisible until the tag-publish path, because only
      # publish.yml runs verify. ~0.2s, so it runs on every PR instead of only on release.
      - name: Check cross-file fact sources
        run: npm run check:facts
      - run: npm run lint --workspaces
      - run: npm test --workspaces --if-present
      # TD-2: coverage thresholds for EVERY workspace, not just core. The vitest configs in
      # each package pin the measured floors (indexer 70/65, mcp 70/50, demo-agent 90/60),
      # so any drop below them fails the PR instead of shipping silently untested —
      # the indexer/mcp gap is exactly where BUG-5/6/7 lived.
      - run: npm run test:coverage --workspace @sigilkit/core
      - run: npm run test:coverage --workspace @sigilkit/indexer
      - run: npm run test:coverage --workspace @sigilkit/mcp
      - run: npm run test:coverage --workspace @sigilkit/demo-agent
      - run: npm run test:coverage --workspace @sigilkit/agent
      - name: Upload vitest coverage summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vitest-coverage
          path: packages/*/coverage/
          # Fail closed: every one of the four runs above produces packages/<pkg>/coverage/,
          # so a green threshold run that leaves no coverage dirs is a run that did not do
          # the work it looks like it did. `error` turns that zero-evidence case loud.
          if-no-files-found: error
      # ARCH-5: every publishable package must pack cleanly on every PR. `files[]` gaps,
      # a missing dist/ or a stray test file otherwise only surface at release time.
      - name: Pack preview (all publishable packages)
        run: |
          for p in core indexer mcp; do
            npm pack --dry-run --workspace "@sigilkit/$p" > /dev/null
            echo "ok: @sigilkit/$p packs"
          done
      # ABI drift gate (E5): regenerate compiler ABIs and fail if the committed files
      # are stale relative to the contracts in this PR. The contract list lives in
      # scripts/abi-targets.txt — the same file the vitest drift gate reads, so the two
      # sides of the gate cannot drift apart (regression: BUG-2 omitted SigilKitDelegator).
      - name: Regenerate contract ABIs
        run: |
          while IFS= read -r c; do
            c="${c%%#*}"; c="$(echo "$c" | tr -d '[:space:]')"
            [ -z "$c" ] && continue
            forge inspect "contracts/src/$c.sol:$c" abi --json > "packages/core/abis/$c.json"
          done < scripts/abi-targets.txt
      - name: Fail on ABI drift
        run: git diff --exit-code packages/core/abis

  # 5. Nightly — deep fuzz (10k runs/test, 1k invariant runs via [profile.deep]) + coverage artifact.
  forge-deep-fuzz:
    name: Forge deep fuzz + coverage (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: deep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - run: forge test --match-contract '.*Invariant'
      # The gas-budget suites are excluded from the coverage RUN: their assertions pin
      # absolute ceilings measured on UNinstrumented bytecode, and coverage instrumentation
      # inflates gas well past every ceiling (measured: proof-element 172699 vs a 160000
      # ceiling, whitelist delta 5029 vs 5000). They are not a coverage property — they run
      # green in the forge-unit job on every PR, which is where real-gas ceilings belong.
      # Without this exclusion the nightly job is red by construction, which masks the ONE
      # signal it exists for (a real invariant failure) behind four instrumentation ghosts.
      # (Single line on purpose: sync-facts.mjs recognises a coverage runner only when the
      # runner word and the flag share a line.)
      - run: forge coverage --report lcov --report summary --no-match-contract 'GasBudgetTest|Gas7579ScalingTest'
      # PERF-4: the budget assertions in GasBudget.t.sol / the 7579 batch test are the
      # hard PR gate. This nightly step reports *drift* on every other test's gas, so a
      # creeping regression is visible without making unrelated PRs fail.
      # `.*Invariant` is excluded on purpose: invariant lines carry a `reverts:` count
      # that is seed-dependent (changes every run), so including them makes the drift
      # report permanently noisy. Only the deterministic unit-test gas lines are snapshotted.
      - name: Gas snapshot drift (report only)
        run: |
          forge snapshot --no-match-contract '.*Invariant|.*Fork'
          if ! git diff --quiet .gas-snapshot; then
            # One grouped redirect rather than four (shellcheck SC2129): the block opens
            # "$GITHUB_STEP_SUMMARY" once and writes all four pieces through it, instead of
            # re-opening the file per echo.
            {
              echo "### Gas snapshot changed"
              echo '```diff'
              git diff .gas-snapshot
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The drift check above is report-only on purpose — gas moves with the solc patch and
      # the runner, so gating exact values would redden unrelated PRs. But "report-only"
      # cannot tell "gas moved" from "this test is not tracked at all", and that is how the
      # snapshot rotted to 162 entries against 228 tests with nothing red. This gates the
      # deterministic half — the SET of test names — so a test can never silently become
      # untracked, and a renamed test cannot leave a stale entry behind.
      - name: Gas snapshot completeness
        run: node scripts/check-gas-snapshot.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-lcov
          path: lcov.info

  # 6. Nightly — Base fork smoke tests.
  # Runs only on the schedule trigger; skips cleanly when secrets.RPC_BASE is unset so a
  # forkless environment reports a skipped job instead of a red one.
  forge-fork-base:
    name: Base fork tests (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    # Promoted to job outputs so a downstream summary job can tell "skipped because
    # RPC_BASE is unset" apart from "passed". `skip` is empty when the gate did not run,
    # which is itself the signal that the fork tests were expected to execute.
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      reason: ${{ steps.gate.outputs.reason }}
    env:
      RPC_BASE: ${{ secrets.RPC_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      # Skip must be DISTINGUISHABLE from a pass. `skip=true` feeds the step-level `if:`s
      # below, but a skipped run and a green run look identical in the job list, so a
      # regression that broke the gate could hide behind a quiet nightly. Emit an explicit
      # annotation so the reason shows in the run UI, and record the reason as an output a
      # downstream summary job can read to report "skipped" instead of "passed".
      - id: gate
        if: env.RPC_BASE == ''
        run: |
          echo "::notice title=Fork tests skipped::RPC_BASE secret is not set, so no Base fork tests ran. Treat this run as SKIPPED, not passed."
          echo "RPC_BASE secret not set; skipping Base fork tests." >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "reason=RPC_BASE secret not set" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: steps.gate.outputs.skip != 'true'
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - run: forge test --fork-url "$RPC_BASE" --match-contract '.*Fork'
        if: steps.gate.outputs.skip != 'true'

  # 7. Release gate — Halmos symbolic verification (6 specs over spend-cap core + Merkle)
  halmos:
    name: Halmos symbolic verification
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HALMOS_ALLOW_DOWNLOAD: "1" # required: halmos downloads solc on first run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install halmos==0.3.3
      - run: halmos --version
      - run: halmos --match-contract Halmos # spend-cap core + auth-path specs (seam harness)

  # 8. Weekly — live wallet conformance harnesses (MetaMask 13.49.0 + Coinbase designator).
  # Real browsers + a real extension: heads-up Chromium on ubuntu (xvfb not needed —
  # Playwright launches headed Chromium fine with --no-sandbox on Linux runners).
  # TD-6 REMOVAL CRITERION (tracked: remove `continue-on-error` on or after 2026-10-12
  # if the four scheduled runs of 2026-09-14/21/28 and 2026-10-05 were green; if any
  # run fails, fix it before the next one instead of extending the waiver. This waiver
  # exists only while the harness has no green history; it must not outlive Q3 2026.)
  wallet-e2e-weekly:
    name: Wallet conformance (weekly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: npm }
      - run: npm ci
      # CQ-6/TD-5: the harness pulls a 24.4 MB extension bundle and a Chromium build on every
      # run. Both are pinned by version, so cache them — this job is the slowest and least
      # reliable in the pipeline, and re-downloading is pure flake surface.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      # The ARCHIVE is cached, not just the extracted tree. A cache holding only the
      # extracted tree cannot be integrity-checked at all — the bytes upstream published a
      # digest for are gone, so a substituted tree is indistinguishable from a good one.
      # Caching the zip restores a checkable artifact on every later run.
      #
      # -v2 suffix: v1 entries hold an extracted tree with no zip, so they cannot be
      # verified. They must not satisfy this key, or the step below would fail closed on a
      # legitimate hit and look like a flaky supply-chain failure.
      - name: Cache pinned MetaMask 13.49.0 extension
        id: metamask-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/core/test/wallet-e2e/metamask.zip
            packages/core/test/wallet-e2e/metamask
          key: metamask-chrome-13.49.0-v2
      - name: Fetch pinned MetaMask 13.49.0 extension
        if: steps.metamask-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/core/test/wallet-e2e
          # AC-04: fail closed. Digest cross-checks against the v13.49.0 release's
          # SHA256SUMS and the asset API's own digest; a silent swap or a truncated
          # download must abort the job, not feed the harness an unknown build.
          curl -sSfL -o metamask.zip \
            "https://github.com/MetaMask/metamask-extension/releases/download/v13.49.0/metamask-chrome-13.49.0.zip"
          echo "7ba00bfe4fe8b0ffb27be1e8fc06506248f1b888cb4f2e5e5e8b1c37f461f262  metamask.zip" | sha256sum --check
      # Deliberately NOT gated on cache-hit. The digest is re-checked on BOTH paths, so a
      # poisoned or substituted cache entry aborts here instead of feeding the harness an
      # unknown build.
      #
      # The tree is deleted and re-extracted rather than extracted over, so the harness only
      # ever sees files that came out of a digest-verified archive. `unzip -o` alone would
      # leave any extra file in a poisoned tree in place.
      - name: Verify extension archive digest and extract
        run: |
          cd packages/core/test/wallet-e2e
          echo "7ba00bfe4fe8b0ffb27be1e8fc06506248f1b888cb4f2e5e5e8b1c37f461f262  metamask.zip" | sha256sum --check
          rm -rf metamask
          unzip -q -o metamask.zip -d metamask
      # NOTE ON WHAT THIS STEP DOES AND DOES NOT ASSERT. It reads a version string out of
      # the extension's own manifest, so a tampered build that still says 13.49.0.0 passes
      # it. It is NOT an integrity check — the digest step above is. This one exists to turn
      # a wrong-extension-mount failure into a legible error, and it keeps its
      # version-specific locators honest.
      - name: Check extension build identity (self-declared, not integrity)
        run: |
          # shellcheck disable=SC2016
          # SC2016 fires on the backticks inside the JS template literal below. They are JS
          # interpolation, not shell expansion — the single quotes are load-bearing: they stop
          # the shell touching `${m.version}` before node ever sees it.
          node -e '
            const m = require("./packages/core/test/wallet-e2e/metamask/manifest.json");
            if (m.version !== "13.49.0.0" || m.manifest_version !== 3) {
              console.error(`unexpected extension build: version=${m.version} mv=${m.manifest_version}`);
              process.exit(1);
            }'
      - run: npx tsx test/wallet-e2e/run-all.ts
        working-directory: packages/core
      # Fail closed: this upload runs under `if: always()` so a run that produced no
      # results artifact must fail the job loudly, not pass it off as an empty log.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wallet-e2e-log
          path: packages/core/test-results/
          if-no-files-found: error

  # 9b. Nightly — Echidna property fuzzing (independent second fuzzer over the same
  # invariants; enhancement E19). TD-6 REMOVAL CRITERION: remove `continue-on-error`
  # after 14 consecutive green nightly runs (i.e. on or after 2026-09-26 if every run
  # since 2026-09-12 passed); a red nightly is a real finding — triage it, don't extend
  # the waiver.
  echidna-nightly:
    name: Echidna property fuzzing (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    # GATING as of 2026-10-02. This job was non-gating on the claim that a local replay
    # failed `echidna_windowSpendUnderCap`; that replay did not reproduce. Run with echidna
    # 2.2.5 + solc 0.8.36 against contracts/test/EchidnaProperties.t.sol
    # (SessionKeyManagerEchidna, --config echidna.yaml), all four properties pass and the
    # process exits 0. The earlier red came from dropping `--solc-version`, which the pinned
    # binary rejects — that changed what got compiled, not a property result. A waiver whose
    # stated evidence does not reproduce is worse than no waiver, so it is removed rather than
    # extended. If a nightly goes red, that is a real finding: triage it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2 (refs/heads/v2, also tag v2.0.2)
        with:
          files: contracts/test/EchidnaProperties.t.sol
          contract: SessionKeyManagerEchidna
          config: echidna.yaml
          solc-version: 0.8.36
          echidna-version: v2.2.5

  # 9. Canary — monthly `nightly` toolchain check so future Foundry flag/config drift
  #    (like the removed --invariant-runs) is caught here, not by a red PR gate.
  foundry-canary:
    name: Foundry nightly canary (monthly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 4 1 * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: nightly }
      - run: forge build 2>&1 | tee canary-build.log
      - run: forge test --match-contract '.*Invariant' 2>&1 | tee canary-invariant.log
      - run: forge test --no-match-contract '.*Invariant|.*Fork' 2>&1 | tee canary-regular.log
      # Fail closed: a canary run that produced no forge output must not read as a healthy
      # one. The job is non-gating, so its only residue is this artifact — without it, a
      # zero-output run (a silent skip, a broken checkout) is invisible. `if: always()` +
      # `if-no-files-found: error` make that indistinguishable-from-green case a loud red.
      # (`-o pipefail` is the runner default shell setting, so `forge ... | tee` still
      # propagates a forge failure.)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: foundry-canary-log
          path: canary-*.log
          if-no-files-found: error
