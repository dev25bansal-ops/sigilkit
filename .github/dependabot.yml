# TD-3: dependency-risk review. npm dependencies previously floated on `^` with no
# automated drift detection — a silent supply-chain risk for a wallet toolkit.
# This file makes Dependabot (or Renovate, which reads the same conventions) propose
# grouped, lockfile-backed updates so drift becomes a reviewable PR instead of a
# surprise at install time. Toolchain pins outside npm (foundry v1.7.1, slither 0.11.6,
# halmos 0.3.3, echidna v2.2.5, gitleaks v8.30.1) are enforced in the workflows
# themselves and re-audited whenever they change.

version: 2
updates:
  # Root + workspace manifests share one lockfile; a single npm ecosystem entry covers
  # the whole monorepo (packages/*/package.json are all installed by the root `npm ci`).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Group everything so one review session covers the weekly drift.
    #
    # CORRECTION (2026-10-04): this comment previously claimed "security bumps still arrive
    # as their own (urgent) PRs via the default security-updates lane". That lane does not
    # exist here — the GitHub API reports `Dependabot alerts are disabled for this repository`
    # (HTTP 403; a private repo needs GitHub Advanced Security). Version-update PRs do run, so
    # a security fix arriving as an ordinary grouped PR is the ONLY path an advisory has.
    # `ci.yml`'s `npm audit` gate is what makes that visible; this file cannot.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors of the two first-party-critical deps deserve individual attention:
      # viem drives every typed call in @sigilkit/core; typescript drives the build.
      major-dev:
        update-types:
          - "major"
    open-pull-requests-limit: 10
    # NO `reviewers:` BLOCK, deliberately (2026-10-04).
    #
    # This file asked for review from `sigilkit/leads`, a team slug that does not exist —
    # `GET /teams/sigilkit/leads` returns 404, and the org has no teams at all. GitHub does
    # NOT error on an unresolvable reviewer: it silently drops the request, so every
    # dependency PR was asking nobody to review it while the config read as though it had an
    # owner. That is worse than no reviewer line, because it looks assigned.
    #
    # The `needs-ci` label below is what actually routes these — it is the same signal the
    # human triage path uses. Add a `reviewers:` entry only once the team exists, and check
    # it with: gh api teams/<slug> (a 404 means the slug is wrong, not that review is optional).
    labels:
      - "dependencies"
      - "needs-ci"
    # Internal workspace deps are pinned to ^0.1.0 (SEC-2); ignore cross-package bumps
    # so Dependabot never proposes publishing-order shuffles.
    ignore:
      - dependency-name: "@sigilkit/*"

  # GitHub Actions versions (checkout, setup-node, cache, upload-artifact, gitleaks
  # download, foundry-toolchain, echidna-action).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-updates:
        update-types:
          - "minor"
          - "patch"
          - "major"
    labels:
      - "ci"
      - "needs-ci"
