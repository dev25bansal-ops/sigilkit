# Echidna config for the SigilKit properties port (enhancement E19).
# Run: echidna contracts/test/EchidnaProperties.t.sol SessionKeyManagerEchidna --config echidna.yaml
testMode: property
testLimit: 50000
corpusDir: echidna-corpus
coverage: true
# Echidna 2.x config keys are camelCase forms of the CLI flags (--seq-len,
# --shrink-limit); "sequenceLength"/"shrinkingSequenceLength" are silently ignored.
seqLen: 100
shrinkLimit: 5000
